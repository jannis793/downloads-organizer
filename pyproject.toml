[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "downloads-organizer"
version = "0.1.0"
description = "A polished CLI for organizing Downloads folders by file type."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "downloads-organizer contributors" }]
keywords = ["downloads", "organizer", "cli", "typer", "rich"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Desktop Environment :: File Managers",
  "Topic :: Utilities",
]
dependencies = [
  "rich>=13.7.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/jannis793/downloads-organizer"
Issues = "https://github.com/jannis793/downloads-organizer/issues"

[project.scripts]
downloads-organizer = "downloads_organizer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/downloads_organizer"]

[tool.pytest.ini_options]
addopts = "--cov=downloads_organizer --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "UP045"]
